[package]
name = "ferrite-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "WASM bindings for Ferrite DB's threadless in-memory vector engine (FDB-EXP-01)"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# Reduced, in-memory core only: the LanceDB/tokio/Rayon substrate and on-disk
# storage/concurrency concerns are excluded automatically on the `wasm32`
# target (FDB-EXP-01). Default features are off so the `substrate` deps
# (LanceDB, tokio, Rayon) are never pulled into the WASM build.
ferrite-db = { path = "../ferrite-db", version = "0.1.0-preview.1", default-features = false }
wasm-bindgen = "0.2"
js-sys = "0.3"
# Parses the JS-side Predicate Tree JSON for the query runner (FDB-EXP-04).
serde_json = "1"
