[package]
name = "ferrite-db"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Embedded low-latency approximate nearest-neighbor search over dense vectors"

[lib]
name = "ferrite_db"

[features]
# Optional observability (ROADMAP FDB-060). Disabled by default so the shipped
# library carries zero tracing cost; enable only when instrumenting.
tracing = ["dep:tracing", "dep:tracing-subscriber"]

[dependencies]
rayon = "1.10"
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", optional = true }
