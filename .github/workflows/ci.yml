name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Keep dev-profile artifacts small: full debuginfo across the LanceDB/
  # DataFusion dependency stack exhausts runner disk during cold builds.
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"

jobs:
  quality:
    name: Rust quality gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Free disk space
        # Cold debug builds of the substrate stack need more room than the
        # runner's preinstalled toolchains leave behind.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/.ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo apt-get clean
          df -h /

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt, clippy

      - name: Build all targets
        run: cargo build --all-targets

      - name: Run tests
        run: cargo test

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check formatting
        run: cargo fmt --check

      - name: Audit substrate containment (FDB-030)
        run: bash tools/audit/substrate_audit.sh

      - name: Install cargo-deny
        # The docker-based EmbarkStudios/cargo-deny-action@v2 intermittently
        # fails when the runner misresolves the action image into its own
        # container label ("pull access denied for <hash>"). Run the prebuilt
        # binary directly instead; FDB-003 allows "cargo-deny or equivalent".
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.20.2

      - name: Audit dependencies
        # `cargo-deny` 0.20.x does not accept `--all-features` at the `check`
        # level; it operates on the resolved lockfile, which already covers
        # every feature combination actually built. The flag was a stale
        # artifact of an earlier CI revision (5f54bc0).
        run: cargo deny --log-level warn check

  slo-smoke:
    name: SLO hard-ceiling smoke (FDB-070)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust 1.97.1
        uses: dtolnay/rust-toolchain@1.97.1

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry
            target
          key: slo-smoke-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}

      - name: Generate smoke fixture
        run: |
          cargo run --release -p corpus-gen -- --out /tmp/smoke-fixtures \
            --num-vectors 5000 --num-queries 50 --top-k 10 --dimension 512 \
            --num-categories 100

      - name: Enforce hard ceilings on exhaustive path (tripwire)
        # Tripwire ceilings are intentionally loose for shared runners; they
        # catch order-of-magnitude regressions. Authoritative §13 ceiling
        # enforcement runs against recorded environments via the same flag.
        run: |
          cargo build --release -p harness
          ./target/release/harness --corpus-dir /tmp/smoke-fixtures \
            --warmup 20 --enforce-ceilings \
            --p50-max-ms 50 --p99-max-ms 120 --recall-min 0.94 \
            --report /tmp/smoke-report.json
          cat /tmp/smoke-report.json >> "$GITHUB_STEP_SUMMARY"
