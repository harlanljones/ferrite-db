name: Deploy Explorer

# Production deployment for the Cloudflare Workers SPA host
# (explorer-web/, FDB-EXP-08). The wrangler dry-run check always runs so a
# broken bundle fails CI even without deploy credentials; the actual
# `wrangler deploy` only fires on main pushes when CLOUDFLARE_API_TOKEN is
# configured as a repository secret.

on:
  push:
    branches: [main]
    paths:
      - "explorer-web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy Explorer SPA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: explorer-web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: explorer-web/package-lock.json

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Type-check and build
        run: npm run build

      - name: Validate production bundle (dry-run)
        run: npx wrangler deploy --dry-run

      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
