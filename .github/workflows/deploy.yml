name: Deploy Explorer

# Production deployment for the Cloudflare Workers SPA host
# (explorer-web/, FDB-EXP-08). The wrangler dry-run check always runs so a
# broken bundle fails CI even without deploy credentials; the actual
# `wrangler deploy` only fires on main pushes when CLOUDFLARE_API_TOKEN is
# configured as a repository secret.

on:
  push:
    branches: [main]
    paths:
      - "explorer-web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Build and deploy Explorer SPA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: explorer-web
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check and build
        run: bun run build

      - name: Validate production bundle (dry-run)
        run: bunx wrangler deploy --dry-run

      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main' && env.CLOUDFLARE_API_TOKEN != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
